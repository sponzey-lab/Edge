name: sponzey-edge-test

services:
  edge-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace
    command: ["sleep", "infinity"]
    environment:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspace/target
    healthcheck:
      test: ["CMD-SHELL", "rustc --version >/dev/null && cargo --version >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  edge-perf:
    profiles: ["performance"]
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    user: "0:0"
    entrypoint:
      - /usr/bin/bash
      - -ec
      - |
        find /var/lib/sponzey-edge/data -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
        cp -a /test-runtime/edge-data/. /var/lib/sponzey-edge/data/
        chown -R edge:edge /var/lib/sponzey-edge/data
        exec /usr/sbin/runuser -u edge -- /usr/local/bin/edge-proxy
    networks:
      - performance-net
    volumes:
      - ./tests/performance/config/edge-perf.toml:/etc/sponzey-edge/current.toml:ro
      - ./artifacts/performance/edge-perf-runtime:/test-runtime:ro
      - edge-perf-data:/var/lib/sponzey-edge/data
    healthcheck:
      test: ["CMD-SHELL", "test -x /usr/local/bin/edge-proxy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: &performance_logging
      driver: local
      options:
        max-size: 10m
        max-file: "3"

  node-upstream:
    profiles: ["performance"]
    image: node:22.14.0-bookworm-slim@sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b
    init: true
    working_dir: /app
    command: ["node", "src/server.mjs"]
    networks:
      performance-net:
        ipv4_address: 172.30.0.3
    ports:
      - "127.0.0.1:${SPONZEY_PERFORMANCE_DASHBOARD_PORT:-3000}:3000"
    volumes:
      - ./tests/performance/node-upstream:/app:ro
      - ./artifacts/performance/edge-perf-runtime/client-ca.pem:/test-pki/client-ca.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *performance_logging

  load-generator:
    profiles: ["performance"]
    image: grafana/k6:0.57.0@sha256:70af91f86cd8e142e0544a4edaf79835a80033f71974b92edd5ac36fd4442a7b
    network_mode: "service:edge-perf"
    depends_on:
      edge-perf:
        condition: service_healthy
    command: ["version"]
    volumes:
      - ./tests/performance/k6:/scripts:ro
      - ./tests/performance/config/edge-perf.toml:/fixtures/edge-perf.toml:ro
      - ./artifacts/performance:/results
    secrets:
      - source: performance-admin-credential
        target: admin-credential.secret
    logging: *performance_logging

  nextcloud:
    profiles: ["nextcloud-e2e"]
    image: nextcloud:30-apache@sha256:4ba4dff13ce3d461180b3b7984207a88ccdd04e9021933ad27336d7427959432
    init: true
    restart: unless-stopped
    environment:
      NEXTCLOUD_ADMIN_USER: test-admin
      NEXTCLOUD_ADMIN_PASSWORD: ${SPONZEY_NEXTCLOUD_E2E_ADMIN_PASSWORD:-test-only-non-production-password}
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.test localhost 127.0.0.1
      OVERWRITEHOST: 127.0.0.1:${SPONZEY_NEXTCLOUD_EDGE_PORT:-18080}
      OVERWRITEPROTOCOL: http
      SQLITE_DATABASE: nextcloud
    networks:
      nextcloud-e2e-net:
        ipv4_address: 172.31.0.3
    volumes:
      - nextcloud-e2e-html:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$status = @file_get_contents(\"http://127.0.0.1/status.php\"); exit($$status === false ? 1 : 0);'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *performance_logging

  edge-nextcloud:
    profiles: ["nextcloud-e2e"]
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    read_only: true
    restart: unless-stopped
    depends_on:
      nextcloud:
        condition: service_healthy
    environment:
      SPONZEY_DATA_DIR: /var/lib/sponzey-edge/data
      SPONZEY_CONFIG_FILE: /etc/sponzey-edge/current.toml
      SPONZEY_ADMIN_BIND: 127.0.0.1:9443
      SPONZEY_LOG_MODE: product
    networks:
      - nextcloud-e2e-net
    ports:
      - "127.0.0.1:${SPONZEY_NEXTCLOUD_EDGE_PORT:-18080}:8080"
    volumes:
      - ./tests/integration/nextcloud/edge-nextcloud.toml:/etc/sponzey-edge/current.toml:ro
      # The adjacent lock belongs beside data, so mount the full owned state root.
      - edge-nextcloud-state:/var/lib/sponzey-edge
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "edge-proxy", "probe", "ready", "--admin-bind", "127.0.0.1:9443"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *performance_logging

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
  edge-perf-data:
  edge-nextcloud-state:
  nextcloud-e2e-html:

networks:
  performance-net:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  nextcloud-e2e-net:
    ipam:
      config:
        - subnet: 172.31.0.0/24

secrets:
  performance-admin-credential:
    file: ./artifacts/performance/edge-perf-runtime/admin-credential.secret
