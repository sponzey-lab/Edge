services:
  edge:
    # The normal service remains non-root. This short-lived backup operation
    # reads the root-owned, owner-only passphrase through the fixed bind mount
    # and must open the edge-owned exclusive data-directory lock.
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE
      # The prior non-root runtime owns the persistent lock file.  FOWNER is
      # required only while the short-lived root backup re-applies its 0600 mode.
      - FOWNER
    volumes:
      - type: bind
        source: /run/secrets/sponzey-edge-upgrade-passphrase
        target: /run/secrets/upgrade-passphrase
        read_only: true
