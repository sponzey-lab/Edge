schema_version = 1

[admin]
bind = "127.0.0.1:9443"
enabled = true

[logging]
mode = "product"

[storage]
data_dir = "/var/lib/sponzey-edge/data"

[runtime]
max_connections = 256
max_inflight_payload_bytes = 33554432

[[listeners]]
name = "http"
bind = "0.0.0.0:8080"
protocol = "http"

[[listeners]]
name = "https"
bind = "0.0.0.0:8443"
protocol = "https"

[[services]]
name = "node-upstream"

[[services.upstreams]]
url = "http://172.30.0.3:3000"

[[services]]
name = "node-api"

[[services.upstreams]]
url = "http://172.30.0.3:3000/route/api"

[[routes]]
name = "edge-test-route"
hosts = ["edge.test"]
paths = ["/"]
service = "node-upstream"
priority = 0
certificate_ref = "edge-test-cert"

[[routes]]
name = "edge-api-route"
hosts = ["edge.test"]
paths = ["/routing"]
service = "node-api"
priority = 20
certificate_ref = "edge-test-cert"

[[routes]]
name = "edge-api-priority-control"
hosts = ["edge.test"]
paths = ["/routing/priority"]
service = "node-upstream"
priority = 10
certificate_ref = "edge-test-cert"
