services:
  edge:
    # New installs pin this complete immutable reference.  The nested fallback
    # keeps a prepared control plane compatible with an older runtime manifest
    # until the upgrade helper atomically stages the local admitted tag.
    image: ${SPONZEY_EDGE_IMAGE_REFERENCE:-ghcr.io/sponzey-lab/sponzey-edge:${SPONZEY_EDGE_TAG:?set a SemVer tag}@sha256:${SPONZEY_EDGE_DIGEST:?set the matching immutable image digest}}
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    environment:
      SPONZEY_DATA_DIR: /var/lib/sponzey-edge/data
      SPONZEY_CONFIG_FILE: /etc/sponzey-edge/current.toml
      SPONZEY_ADMIN_BIND: 127.0.0.1:9443
      SPONZEY_LOG_MODE: product
    volumes:
      # The runtime keeps its exclusive data-directory lock beside `data`.
      # Mount the owned state root, while keeping the image root filesystem read-only.
      - edge-data:/var/lib/sponzey-edge
      # The host primary config is bootstrap-only and must never be writable by the container.
      - /etc/sponzey-edge/current.toml:/etc/sponzey-edge/current.toml:ro
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "edge-proxy", "probe", "ready", "--admin-bind", "127.0.0.1:9443"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  edge-data:
