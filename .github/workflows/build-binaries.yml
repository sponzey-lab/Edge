name: Build Binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: edge-proxy-linux-x86_64
            binary_name: edge-proxy
            binary_path: target/release/edge-proxy
            package_name: edge-proxy-linux-x86_64.tar.gz
            package_command: mkdir -p dist/systemd dist/compose && cp packaging/systemd/sponzey-edge.service dist/systemd/ && cp packaging/systemd/install.sh packaging/systemd/uninstall.sh packaging/systemd/upgrade-helper dist/systemd/ && cp packaging/systemd/preflight.sh dist/systemd/ && cp packaging/compose/compose-upgrade-helper packaging/compose/install.sh packaging/compose/docker-compose.upgrade.yml dist/compose/ && cp docker-compose.yml dist/compose/docker-compose.yml && cp examples/minimal.toml dist/current.toml && tar -czf dist/edge-proxy-linux-x86_64.tar.gz -C dist edge-proxy current.toml systemd compose
          - os: ubuntu-24.04-arm
            artifact_name: edge-proxy-linux-arm64
            binary_name: edge-proxy
            binary_path: target/release/edge-proxy
            package_name: edge-proxy-linux-arm64.tar.gz
            package_command: mkdir -p dist/systemd dist/compose && cp packaging/systemd/sponzey-edge.service dist/systemd/ && cp packaging/systemd/install.sh packaging/systemd/uninstall.sh packaging/systemd/upgrade-helper dist/systemd/ && cp packaging/systemd/preflight.sh dist/systemd/ && cp packaging/compose/compose-upgrade-helper packaging/compose/install.sh packaging/compose/docker-compose.upgrade.yml dist/compose/ && cp docker-compose.yml dist/compose/docker-compose.yml && cp examples/minimal.toml dist/current.toml && tar -czf dist/edge-proxy-linux-arm64.tar.gz -C dist edge-proxy current.toml systemd compose
          - os: macos-15-intel
            artifact_name: edge-proxy-macos-x86_64
            binary_name: edge-proxy
            binary_path: target/release/edge-proxy
            package_name: edge-proxy-macos-x86_64.tar.gz
            package_command: tar -czf dist/edge-proxy-macos-x86_64.tar.gz -C dist edge-proxy
          - os: macos-latest
            artifact_name: edge-proxy-macos-arm64
            binary_name: edge-proxy
            binary_path: target/release/edge-proxy
            package_name: edge-proxy-macos-arm64.tar.gz
            package_command: tar -czf dist/edge-proxy-macos-arm64.tar.gz -C dist edge-proxy
          - os: windows-latest
            artifact_name: edge-proxy-windows-x86_64
            binary_name: edge-proxy.exe
            binary_path: target/release/edge-proxy.exe
            package_name: edge-proxy-windows-x86_64.zip
            package_command: powershell -NoProfile -Command "Compress-Archive -Path dist/edge-proxy.exe -DestinationPath dist/edge-proxy-windows-x86_64.zip -Force"
          - os: windows-11-arm
            artifact_name: edge-proxy-windows-arm64
            binary_name: edge-proxy.exe
            binary_path: target/release/edge-proxy.exe
            package_name: edge-proxy-windows-arm64.zip
            package_command: powershell -NoProfile -Command "Compress-Archive -Path dist/edge-proxy.exe -DestinationPath dist/edge-proxy-windows-arm64.zip -Force"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/release/validate_release_metadata.py --workspace . --tag "${{ github.ref_name }}"

      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal

      - name: Build release binary
        run: cargo build --release --locked -p edge-proxy

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.binary_name }}"
          ${{ matrix.package_command }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.package_name }}
          if-no-files-found: error

  release:
    name: Publish Linux release and GHCR image
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release tag
        id: release_tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "Release tag accepted: ${tag}"
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Release tag skipped: ${tag}"
          fi

      - name: Download build artifacts
        if: steps.release_tag.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: edge-proxy-linux-*
          path: release-input
          merge-multiple: true

      - name: Set up QEMU
        if: steps.release_tag.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.release_tag.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.release_tag.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish GHCR image
        id: image
        if: steps.release_tag.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/sponzey-lab/sponzey-edge:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/sponzey-lab/Sponzey-Edge

      - name: Verify published GHCR image is publicly pullable
        if: steps.release_tag.outputs.publish == 'true'
        shell: bash
        run: |
          docker logout ghcr.io || true
          docker pull ghcr.io/sponzey-lab/sponzey-edge:${GITHUB_REF_NAME}@${{ steps.image.outputs.digest }}

      - name: Assemble release assets
        if: steps.release_tag.outputs.publish == 'true'
        shell: bash
        run: |
          python3 tools/release/assemble_release_artifacts.py \
            --artifacts release-input \
            --output release-assets \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --image "ghcr.io/sponzey-lab/sponzey-edge:${GITHUB_REF_NAME}@${{ steps.image.outputs.digest }}" \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Validate release manifest
        if: steps.release_tag.outputs.publish == 'true'
        run: python3 tools/release/validate_release_manifest.py --manifest release-assets/release-manifest.json --artifacts release-assets

      - name: Create GitHub Release
        if: steps.release_tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sponzey Edge ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
