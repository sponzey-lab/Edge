name: Build Binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Source quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace -- --test-threads=1

      - name: HTTP framing mutation smoke
        run: cargo run -p edge-core --example http_framing_mutation_fuzz -- 1000

      - name: Architecture fitness
        run: python3 tools/release/check_architecture.py --workspace .

      - name: Source index fitness
        run: python3 tools/release/check_source_indexes.py --workspace .

      - name: Dependency audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  build:
    needs: quality
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: edge-proxy-linux-x86_64
            binary_name: edge-proxy
            rust_target: x86_64-unknown-linux-musl
            linux_musl: true
            binary_path: target/x86_64-unknown-linux-musl/release/edge-proxy
            package_name: edge-proxy-linux-x86_64.tar.gz
            package_command: mkdir -p dist/systemd dist/compose && cp packaging/systemd/sponzey-edge.service dist/systemd/ && cp packaging/systemd/install.sh packaging/systemd/uninstall.sh packaging/systemd/upgrade-helper dist/systemd/ && cp packaging/systemd/preflight.sh dist/systemd/ && cp packaging/compose/compose-upgrade-helper packaging/compose/install.sh packaging/compose/prepare-upgrade.sh packaging/compose/docker-compose.upgrade.yml dist/compose/ && cp docker-compose.yml dist/compose/docker-compose.yml && cp examples/minimal.toml dist/current.toml && tar -czf dist/edge-proxy-linux-x86_64.tar.gz -C dist edge-proxy current.toml systemd compose
          - os: ubuntu-24.04-arm
            artifact_name: edge-proxy-linux-arm64
            binary_name: edge-proxy
            rust_target: aarch64-unknown-linux-musl
            linux_musl: true
            binary_path: target/aarch64-unknown-linux-musl/release/edge-proxy
            package_name: edge-proxy-linux-arm64.tar.gz
            package_command: mkdir -p dist/systemd dist/compose && cp packaging/systemd/sponzey-edge.service dist/systemd/ && cp packaging/systemd/install.sh packaging/systemd/uninstall.sh packaging/systemd/upgrade-helper dist/systemd/ && cp packaging/systemd/preflight.sh dist/systemd/ && cp packaging/compose/compose-upgrade-helper packaging/compose/install.sh packaging/compose/prepare-upgrade.sh packaging/compose/docker-compose.upgrade.yml dist/compose/ && cp docker-compose.yml dist/compose/docker-compose.yml && cp examples/minimal.toml dist/current.toml && tar -czf dist/edge-proxy-linux-arm64.tar.gz -C dist edge-proxy current.toml systemd compose
          - os: macos-15-intel
            artifact_name: edge-proxy-macos-x86_64
            binary_name: edge-proxy
            binary_path: target/release/edge-proxy
            package_name: edge-proxy-macos-x86_64.tar.gz
            package_command: tar -czf dist/edge-proxy-macos-x86_64.tar.gz -C dist edge-proxy
          - os: macos-latest
            artifact_name: edge-proxy-macos-arm64
            binary_name: edge-proxy
            binary_path: target/release/edge-proxy
            package_name: edge-proxy-macos-arm64.tar.gz
            package_command: tar -czf dist/edge-proxy-macos-arm64.tar.gz -C dist edge-proxy
          - os: windows-latest
            artifact_name: edge-proxy-windows-x86_64
            binary_name: edge-proxy.exe
            binary_path: target/release/edge-proxy.exe
            package_name: edge-proxy-windows-x86_64.zip
            package_command: powershell -NoProfile -Command "Compress-Archive -Path dist/edge-proxy.exe -DestinationPath dist/edge-proxy-windows-x86_64.zip -Force"
          - os: windows-11-arm
            artifact_name: edge-proxy-windows-arm64
            binary_name: edge-proxy.exe
            binary_path: target/release/edge-proxy.exe
            package_name: edge-proxy-windows-arm64.zip
            package_command: powershell -NoProfile -Command "Compress-Archive -Path dist/edge-proxy.exe -DestinationPath dist/edge-proxy-windows-arm64.zip -Force"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/release/validate_release_metadata.py --workspace . --tag "${{ github.ref_name }}"

      - name: Install Rust
        run: |
          rustup toolchain install 1.94.0 --profile minimal

      - name: Install static Linux target
        if: matrix.linux_musl
        run: |
          rustup target add ${{ matrix.rust_target }}
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        if: matrix.linux_musl
        run: cargo build --release --locked -p edge-proxy --target ${{ matrix.rust_target }}

      - name: Build native release binary
        if: ${{ !matrix.linux_musl }}
        run: cargo build --release --locked -p edge-proxy

      - name: Verify Linux archive binary is statically linked
        if: matrix.linux_musl
        shell: bash
        run: |
          description="$(file "${{ matrix.binary_path }}")"
          printf '%s\n' "${description}"
          if [[ "${description}" != *"statically linked"* && "${description}" != *"static-pie linked"* ]]; then
            echo "Linux archive binary must be statically linked or static PIE." >&2
            exit 1
          fi

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.binary_name }}"
          ${{ matrix.package_command }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.package_name }}
          if-no-files-found: error

  release:
    name: Publish Linux release and GHCR image
    needs: [quality, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check release tag
        id: release_tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "Release tag accepted: ${tag}"
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Release tag skipped: ${tag}"
          fi

      - name: Download build artifacts
        if: steps.release_tag.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: edge-proxy-linux-*
          path: release-input
          merge-multiple: true

      - name: Set up QEMU
        if: steps.release_tag.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.release_tag.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.release_tag.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish GHCR image
        id: image
        if: steps.release_tag.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/sponzey-lab/sponzey-edge:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/sponzey-lab/Sponzey-Edge
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Verify published GHCR image is publicly pullable
        if: steps.release_tag.outputs.publish == 'true'
        shell: bash
        run: |
          docker logout ghcr.io || true
          image="ghcr.io/sponzey-lab/sponzey-edge:${GITHUB_REF_NAME}@${{ steps.image.outputs.digest }}"
          docker pull "${image}"

      - name: Verify published GHCR image identity labels
        if: steps.release_tag.outputs.publish == 'true'
        shell: bash
        run: |
          image="ghcr.io/sponzey-lab/sponzey-edge:${GITHUB_REF_NAME}@${{ steps.image.outputs.digest }}"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")"
          version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${image}")"
          test "${revision}" = "${GITHUB_SHA}"
          test "${version}" = "${GITHUB_REF_NAME}"

      - name: Assemble release assets
        if: steps.release_tag.outputs.publish == 'true'
        shell: bash
        run: |
          python3 tools/release/assemble_release_artifacts.py \
            --artifacts release-input \
            --output release-assets \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --image "ghcr.io/sponzey-lab/sponzey-edge:${GITHUB_REF_NAME}@${{ steps.image.outputs.digest }}" \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Validate release manifest
        if: steps.release_tag.outputs.publish == 'true'
        run: python3 tools/release/validate_release_manifest.py --manifest release-assets/release-manifest.json --artifacts release-assets

      - name: Create GitHub prerelease candidate
        if: steps.release_tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sponzey Edge ${{ github.ref_name }}
          body: |-
            Candidate only: clean-host matrix evidence is required before product promotion.
            Image: ghcr.io/sponzey-lab/sponzey-edge:${{ github.ref_name }}@${{ steps.image.outputs.digest }}
          prerelease: true
          files: release-assets/*
          fail_on_unmatched_files: true
